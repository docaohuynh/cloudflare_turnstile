include: package:very_good_analysis/analysis_options.6.0.0.yaml

formatter:
  page_width: 80

analyzer:
  errors:
    unnecessary_library_directive: ignore
    inference_failure_on_function_return_type: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    lines_longer_than_80_chars: false